services:
  # --------- PROD API ---------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2-api

    # All sensitive data comes from .env (which is in .gitignore)
    env_file:
      - .env
    environment:
      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://0.0.0.0:${API_PORT_CONTAINER}"

      # Admin panel API key (from .env)
      ADMIN_AUTH_APIKEY: ${ADMIN_AUTH_APIKEY}

      # URL of the ML service
      ML_SERVICE_URL: ${ML_SERVICE_URL}

      # Connection strings
      ConnectionStrings__DefaultConnection: "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__AdminConnection: "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      # OpenAI (API key is taken from .env)
      OpenAI__ApiKey: ${OpenAI__ApiKey}

    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

    ports:
      - "${API_PORT_HOST}:${API_PORT_CONTAINER}"  # 8087:8080

    volumes:
      # CSV for seeder (read-only)
      - ./data_for_db:/app/data_for_db:ro

    networks:
      - cs2-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------- DEV API with hot reload ---------
  api-dev:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: cs2-api-dev
    working_dir: /src

    volumes:
      - ./:/src

    command: >
      sh -c "dotnet restore && dotnet watch run --urls http://0.0.0.0:${API_PORT_CONTAINER}"

    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ADMIN_AUTH_APIKEY: ${ADMIN_AUTH_APIKEY}

      ConnectionStrings__DefaultConnection: "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__AdminConnection: "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      ML_SERVICE_URL: ${ML_SERVICE_URL}

      OpenAI__ApiKey: ${OpenAI__ApiKey}

    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

    ports:
      - "${API_PORT_HOST}:${API_PORT_CONTAINER}"

    networks:
      - cs2-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------- ML service ---------
  ml-service:
    build:
      context: .
      dockerfile: cs2_ml_service/Dockerfile
    container_name: cs2-ml

    env_file:
      - .env
    environment:
      # Inside the container, models will be stored here
      MODELS_DIR: "/app/models"

    expose:
      - "${ML_PORT_CONTAINER}"

    ports:
      - "${ML_PORT_HOST}:${ML_PORT_CONTAINER}"  # 8000:8000 from .env

    volumes:
      # Mount CatBoost models from host into the container (read-only)
      - ./cs2_ml_service/models:/app/models:ro

    networks:
      - cs2-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------- Postgres ---------
  db:
    image: postgres:16-alpine   # fixed version, not latest
    container_name: cs2-postgres
    restart: always

    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT_CONTAINER}"  # 5435:5432

    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - cs2-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:

networks:
  cs2-net:
    driver: bridge
