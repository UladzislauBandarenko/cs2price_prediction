version: "3.9"

services:
  # --------- PRODUCTION API ---------
  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cs2-api

    env_file:
      - .env
    environment:
      # ASP.NET Core settings
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://0.0.0.0:${API_PORT_CONTAINER}"

      # Admin panel API key
      ADMIN_AUTH_APIKEY: ${ADMIN_AUTH_APIKEY}

      # ML service internal URL
      ML_SERVICE_URL: ${ML_SERVICE_URL}

      # Database connection strings (application users)
      ConnectionStrings__DefaultConnection: "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASS}"
      ConnectionStrings__AdminConnection:   "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${APP_DB_ADMIN_USER};Password=${APP_DB_ADMIN_PASS}"

      # OpenAI
      OpenAI__ApiKey: ${OpenAI__ApiKey}

    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

    ports:
      - "${API_PORT_HOST}:${API_PORT_CONTAINER}" # e.g. 8087:8080

    volumes:
      # CSV files for database seeding (read-only)
      - ./data_for_db:/app/data_for_db:ro

    networks:
      - cs2-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT_CONTAINER}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------- DEVELOPMENT API (HOT RELOAD) ---------
  api-dev:
    profiles: ["dev"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: cs2-api-dev
    working_dir: /src

    volumes:
      # Mount source code for hot reload
      - ./:/src

    command: >
      sh -c "dotnet restore && dotnet watch run --urls http://0.0.0.0:${API_PORT_CONTAINER}"

    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ADMIN_AUTH_APIKEY: ${ADMIN_AUTH_APIKEY}
      ML_SERVICE_URL: ${ML_SERVICE_URL}

      # Same database connections as production API
      ConnectionStrings__DefaultConnection: "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASS}"
      ConnectionStrings__AdminConnection:   "Host=db;Port=${POSTGRES_PORT_CONTAINER};Database=${POSTGRES_DB};Username=${APP_DB_ADMIN_USER};Password=${APP_DB_ADMIN_PASS}"

      OpenAI__ApiKey: ${OpenAI__ApiKey}

    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy

    ports:
      - "${API_PORT_HOST}:${API_PORT_CONTAINER}" # Same port, but never runs together with prod

    networks:
      - cs2-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_PORT_CONTAINER}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------- ML SERVICE ---------
  ml-service:
    build:
      context: .
      dockerfile: cs2_ml_service/Dockerfile
    container_name: cs2-ml

    env_file:
      - .env
    environment:
      MODELS_DIR: "/app/models"

    expose:
      - "${ML_PORT_CONTAINER}"

    ports:
      - "${ML_PORT_HOST}:${ML_PORT_CONTAINER}" # e.g. 8000:8000

    volumes:
      # Pretrained ML models (read-only)
      - ./cs2_ml_service/models:/app/models:ro

    networks:
      - cs2-net

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${ML_PORT_CONTAINER}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------- POSTGRES DATABASE ---------
  db:
    image: postgres:16-alpine
    container_name: cs2-postgres
    restart: always

    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT_HOST}:${POSTGRES_PORT_CONTAINER}" # e.g. 5435:5432

    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - cs2-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:

networks:
  cs2-net:
    driver: bridge
